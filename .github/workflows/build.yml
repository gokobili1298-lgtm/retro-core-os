name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libltdl-dev libffi-dev libssl-dev python3-pip python3-setuptools python3-dev zip unzip zlib1g-dev openjdk-17-jdk autoconf libtool pkg-config cmake libncurses5-dev libncursesw5-dev libtinfo6
          pip install --upgrade pip
          pip install cython==0.29.36 "setuptools<66.0.0" buildozer

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-core-apk
          path: bin/*.apk
